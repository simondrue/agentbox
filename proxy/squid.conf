http_port 3128
visible_hostname agentbox-proxy

# Runtime files stay in temporary storage.
pid_filename /tmp/squid.pid
cache_log /tmp/cache.log
access_log stdio:/tmp/access.log
cache_store_log none
cache deny all

# Permit HTTPS tunnels only.
acl tls_connect method CONNECT
acl tls_port port 443

# Exact hostnames; no wildcard subdomains or reverse DNS matching.
acl allowed_hosts dstdomain -n api.openai.com chatgpt.com auth.openai.com github.com

# Reject local, private, and special-use destinations.
acl blocked_ips dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10
acl blocked_ips dst 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl blocked_ips dst 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl blocked_ips dst ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8

http_access deny !tls_connect
http_access deny !tls_port
http_access deny !allowed_hosts
http_access deny blocked_ips
http_access allow allowed_hosts
http_access deny all

shutdown_lifetime 1 seconds
